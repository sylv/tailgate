name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # bump for breaking changes, like moving to tailscale services
  MAJOR: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client typecheck
      - run: pnpm --filter client lint
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: |
          ts=$(awk '$1 == "tailscale.com" { sub(/^v/, "", $2); print $2 }' go.mod)
          version=v$MAJOR-$ts-$(git rev-parse --short=7 HEAD)
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "geoip=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$image:latest"
            echo "$image:v$MAJOR"
            echo "$image:$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GEOIP_MONTH=${{ steps.meta.outputs.geoip }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
